name: Deploy game to GitHub Pages

# Publishes the static game whenever the branch updates. No build step —
# the repo root is the site. Turn it on once: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches:
      - claude/ai-rpg-old-pc-jul51q
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on automatically so there's no manual settings step.
          enablement: true

      - name: Upload site (repo root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
